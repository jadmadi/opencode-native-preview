# cargo-about's configuration for THIRD-PARTY-NOTICES.txt: the crates linked into opencode-native (the tree-sitter
# grammars among them) on the targets the preview builds. Build and dev dependencies are not in the binary, and the
# workspace's own crates are not published (`publish = false`), so neither is listed.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
# The licences the binary may carry. A crate under any other licence fails the build, so a new one is a decision.
accepted = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "Zlib", "Unicode-3.0", "CC0-1.0"]

# OpenTUI's bindings from crates.io (opentui-sys since v0.9.6) are `MIT AND LGPL-2.1-or-later`: the native library they link
# statically includes LGPL code (FFmpeg), which ships with its own files in licenses/opentui (O-156). Accepted for this
# crate only, as the client's deny.toml does.
[opentui-sys]
accepted = ["LGPL-2.1-or-later"]
